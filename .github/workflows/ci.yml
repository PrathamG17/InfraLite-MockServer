name: InfraLite-MockServer CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    env:
      JWT_SECRET: localdevsecret   

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install CMake
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

    - name: Ensure certs directory exists
      run: mkdir certs -Force

    - name: Generate self-signed cert
      run: |
        openssl req -x509 -newkey rsa:2048 `
          -keyout certs/server.key `
          -out certs/server.crt `
          -days 1 -nodes `
          -subj "/CN=localhost"

    - name: List certs
      run: dir certs

    - name: Create build directory
      run: mkdir build -Force

    - name: Configure CMake
      run: |
        cd build
        cmake ..

    - name: Build project (Release)
      run: |
        cd build
        cmake --build . --config Release

    # Debug run in foreground to capture stderr/stdout
    - name: Run server in foreground (debug)
      shell: powershell
      run: |
        cd build\Release
        .\infralite.exe
      continue-on-error: true

    - name: Start server in background
      shell: powershell
      run: |
        cd build\Release
        Start-Process -FilePath .\infralite.exe
        Start-Sleep -Seconds 10

    - name: Wait for server health
      shell: powershell
      run: |
        $maxRetries = 5
        for ($i=0; $i -lt $maxRetries; $i++) {
          try {
            Invoke-WebRequest http://localhost:8080/hello
            Write-Host "Server is up!"
            exit 0
          } catch {
            Write-Host "Server not ready, retrying..."
            Start-Sleep -Seconds 2
          }
        }
        Write-Error "Server did not start in time"
        exit 1

    - name: Run route tests
      shell: powershell
      run: |
        pip install pytest requests
        pytest tests/test_routes.py -v --junitxml=report.xml

    - name: Upload server logs
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: logs/InfraLite-MockServer.log
        if-no-files-found: warn

    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: report.xml
        if-no-files-found: warn