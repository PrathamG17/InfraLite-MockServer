name: InfraLite-MockServer CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install CMake
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

    - name: Create build directory
      run: mkdir build

    - name: Configure CMake
      run: |
        cd build
        cmake ..

    - name: Build project (Release)
      run: |
        cd build
        cmake --build . --config Release

    - name: Start server in background
      shell: powershell
      run: |
        cd build\Release
        Start-Process -FilePath .\infralite.exe
        Start-Sleep -Seconds 5

    - name: Wait for server health
      shell: powershell
      run: |
        $maxRetries = 10
        for ($i=0; $i -lt $maxRetries; $i++) {
          try {
            Invoke-WebRequest http://localhost:8080/hello -UseBasicParsing
            Write-Host "Server is up!"
            exit 0
          } catch {
            Write-Host "Server not ready, retrying..."
            Start-Sleep -Seconds 2
          }
        }
        Write-Error "Server did not start in time"
        exit 1

    - name: Run route tests
      shell: powershell
      run: |
        pip install pytest requests
        pytest tests/test_routes.py -v

    - name: Upload server logs
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: logs/InfraLite-MockServer.log
        if-no-files-found: warn
