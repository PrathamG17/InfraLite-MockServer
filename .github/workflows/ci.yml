name: InfraLite-MockServer CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    env:
      JWT_SECRET: localdevsecret   

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install CMake
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

    # Generate certs in project root (certs/ folder tracked via .gitkeep)
    - name: Generate self-signed TLS cert
      shell: powershell
      run: |
        mkdir certs -Force
        openssl req -x509 -newkey rsa:2048 -nodes `
          -keyout certs\\server.key `
          -out certs\\server.crt -days 1 `
          -subj "/CN=localhost"

    - name: List certs
      run: dir certs

    - name: Create build directory
      run: mkdir build -Force

    - name: Configure CMake
      run: |
        cd build
        cmake ..

    - name: Build project (Release)
      run: |
        cd build
        cmake --build . --config Release

    # Start server in background so workflow continues
    - name: Start server (background)
      shell: powershell
      run: |
        cd build\Release
        Write-Host "Starting server in background..."
        Start-Process -FilePath ".\infralite.exe" -RedirectStandardOutput "server.log"
        exit 0

    - name: Upload server logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: build/Release/server.log
        if-no-files-found: warn

    - name: Diagnostics - process and port check
      shell: powershell
      run: |
        Write-Host "=== Process list ==="
        Get-Process infralite -ErrorAction SilentlyContinue | Format-List Id, ProcessName, StartTime

        Write-Host "=== Port binding check (8080) ==="
        netstat -ano | findstr ":8080"

    - name: Wait for server health
      shell: powershell
      run: |
        $maxRetries = 5
        $retryDelay = 5
        [System.Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }
        for ($i=1; $i -le $maxRetries; $i++) {
          Write-Host "Health check attempt $i of $maxRetries..."
          try {
            $response = Invoke-WebRequest -Uri "http://127.0.0.1:8080/hello" -UseBasicParsing -TimeoutSec 5
            if ($response.StatusCode -eq 200) {
              Write-Host "? Server is up!"
              exit 0
            }
          } catch {
            Write-Warning "Server not ready (attempt $i). Error: $($_.Exception.Message)"
            Start-Sleep -Seconds $retryDelay
          }
        }
        Write-Error "? Server did not start after $maxRetries attempts."
        exit 1

    - name: Run route tests
      shell: powershell
      run: |
        pip install pytest requests
        pytest tests/test_routes.py -v --junitxml=report.xml

    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: report.xml
        if-no-files-found: warn
