name: InfraLite-MockServer CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    env:
      JWT_SECRET: localdevsecret   

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install CMake
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

    # Generate certs in project root (certs/ folder tracked via .gitkeep)
    - name: Generate self-signed TLS cert
      shell: powershell
      run: |
        mkdir certs -Force
        openssl req -x509 -newkey rsa:2048 -nodes `
          -keyout certs\server.key `
          -out certs\server.crt -days 1 `
          -subj "/CN=localhost"

    - name: List certs
      run: dir certs

    - name: Create build directory
      run: mkdir build -Force

    - name: Configure CMake
      run: |
        cd build
        cmake ..

    - name: Build project (Release)
      run: |
        cd build
        cmake --build . --config Release

    # Start server in background so workflow continues
    - name: Start server (background)
      shell: powershell
      run: |
        $serverExe = Join-Path $PWD "build\Release\infralite.exe"
        Write-Host "Starting server in background..."
        Start-Process -FilePath $serverExe -WorkingDirectory $PWD
        Start-Sleep -Seconds 3
        exit 0

    - name: Upload server stdout logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: server-stdout
        path: server.log
        if-no-files-found: warn

    - name: Upload application logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-logs
        path: logs/InfraLite-MockServer.log
        if-no-files-found: warn

    - name: Diagnostics - process and port check
      shell: powershell
      run: |
        Write-Host "=== Process list ==="
        Get-Process infralite -ErrorAction SilentlyContinue | Format-List Id, ProcessName, StartTime

    - name: Run route tests
      shell: powershell
      run: |
        pip install pytest requests
        pytest tests/test_routes.py -v --junitxml=report.xml

    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: report.xml
        if-no-files-found: warn
