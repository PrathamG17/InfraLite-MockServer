name: InfraLite-MockServer CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    env:
      JWT_SECRET: localdevsecret   

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install CMake
      run: choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

    - name: Ensure certs directory exists
      run: mkdir certs -Force

    - name: Generate self-signed cert
      run: |
        openssl req -x509 -newkey rsa:2048 `
          -keyout certs/server.key `
          -out certs/server.crt `
          -days 1 -nodes `
          -subj "/CN=localhost"

    - name: List certs
      run: dir certs

    - name: Create build directory
      run: mkdir build -Force

    - name: Configure CMake
      run: |
        cd build
        cmake ..

    - name: Build project (Release)
      run: |
        cd build
        cmake --build . --config Release

    - name: Start server in background
      shell: powershell
      run: |
        cd build\Release
        Start-Process -FilePath .\infralite.exe -NoNewWindow
        Write-Host "Server process started, waiting before health checks..."
        Start-Sleep -Seconds 10

    - name: Diagnostics - check port and first request
      shell: powershell
      run: |
        Write-Host "Checking if port 8080 is bound..."
        netstat -ano | findstr :8080
        Write-Host "Trying one-off request to /hello (IPv4)..."
        try {
          Invoke-WebRequest http://127.0.0.1:8080/hello -UseBasicParsing -TimeoutSec 5
        } catch {
          Write-Warning "Initial IPv4 /hello request failed: $($_.Exception.Message)"
        }
        Write-Host "Trying one-off request to /hello (IPv6)..."
        try {
          Invoke-WebRequest http://[::1]:8080/hello -UseBasicParsing -TimeoutSec 5
        } catch {
          Write-Warning "Initial IPv6 /hello request failed: $($_.Exception.Message)"
        }

    - name: Wait for server health
      shell: powershell
      run: |
        $maxRetries = 10
        $retryDelay = 5
        $serverReady = $false

        for ($i=1; $i -le $maxRetries; $i++) {
          Write-Host "Health check attempt $i of $maxRetries..."
          try {
            $response = Invoke-WebRequest -Uri http://127.0.0.1:8080/hello -UseBasicParsing -TimeoutSec 5
            if ($response.StatusCode -eq 200) {
              Write-Host "? Server is up via IPv4!"
              $serverReady = $true
              break
            }
          } catch {
            try {
              $response = Invoke-WebRequest -Uri http://[::1]:8080/hello -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "? Server is up via IPv6!"
                $serverReady = $true
                break
              }
            } catch {
              Write-Warning "Server not ready (attempt $i). Error: $($_.Exception.Message)"
              Start-Sleep -Seconds $retryDelay
            }
          }
        }

        if (-not $serverReady) {
          Write-Error "? Server did not start after $maxRetries attempts. Check logs for details."
          exit 1
        }

    - name: Run route tests
      shell: powershell
      run: |
        pip install pytest requests
        pytest tests/test_routes.py -v --junitxml=report.xml

    - name: Upload server logs
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: logs/InfraLite-MockServer.log
        if-no-files-found: warn

    - name: Upload test report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: report.xml
        if-no-files-found: warn
